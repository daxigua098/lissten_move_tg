[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-lead-system"
version = "0.1.0"
description = "Telegram 内容搬运 + 会员线索生产系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "loguru>=0.7.3",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "psutil>=6.1",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "Pillow>=11.0.0",
  "telethon>=1.39.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
# 设计文档是 Markdown，交给 ruff 处理会破坏内容与排版
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入约定就是在默认值里调用 Depends()
"app/api/*.py" = ["B008"]
"app/api/**/*.py" = ["B008"]
